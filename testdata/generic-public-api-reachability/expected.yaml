build_configurations:
  - name: "normal"
    build_tags: []
    enable_cgo: false
    goarch: "amd64"
    expected_unused:
      - func: "github.com/715d/unusedfunc/testdata/generic-public-api-reachability.unusedControl"
        reason: "unexported function not used"
      - func: "github.com/715d/unusedfunc/testdata/generic-public-api-reachability.unusedGenericControl[T]"
        reason: "unexported generic function not used"
      - func: "github.com/715d/unusedfunc/testdata/generic-public-api-reachability.NewBox.unusedNewMethodControl"
        reason: "unexported method not used"
      - func: "github.com/715d/unusedfunc/testdata/generic-public-api-reachability.OldBox[T].unusedOldMethodControl"
        reason: "unexported generic receiver method not used"
      - func: "github.com/715d/unusedfunc/testdata/generic-public-api-reachability.unrelatedWorker.run"
        reason: "unrelated interface implementation not used"
      - func: "github.com/715d/unusedfunc/testdata/generic-public-api-reachability.unrelatedLeaf"
        reason: "unrelated interface implementation helper not used"
    expected_errors: []
